<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4a2c"/>
      <stop offset="1" stop-color="#0f6b3f"/>
    </linearGradient>
    <pattern id="stripes" width="120" height="300" patternUnits="userSpaceOnUse">
      <rect width="60" height="300" fill="#ffffff" opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#g)"/>
  <rect width="1200" height="300" rx="18" fill="url(#stripes)"/>
  <!-- pitch markings -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2.5">
    <rect x="24" y="24" width="1152" height="252" rx="6"/>
    <line x1="860" y1="24" x2="860" y2="276"/>
    <circle cx="860" cy="150" r="70"/>
    <rect x="1056" y="80" width="120" height="140"/>
    <rect x="1130" y="115" width="46" height="70"/>
  </g>
  <circle cx="860" cy="150" r="5" fill="#ffffff" fill-opacity="0.3"/>
  <!-- agent network -->
  <g stroke="#f6c343" stroke-opacity="0.75" stroke-width="2">
    <line x1="790" y1="105" x2="925" y2="120"/>
    <line x1="790" y1="105" x2="845" y2="215"/>
    <line x1="925" y1="120" x2="845" y2="215"/>
    <line x1="925" y1="120" x2="1010" y2="190"/>
  </g>
  <g stroke="#ffffff" stroke-width="3">
