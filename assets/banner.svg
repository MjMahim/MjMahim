    <circle cx="925" cy="120" r="13" fill="#eb6834"/>
    <circle cx="845" cy="215" r="13" fill="#1baf7a"/>
    <circle cx="1010" cy="190" r="9" fill="#9b4dca"/>
  </g>
  <text x="64" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">Monjurul Islam Mahim</text>
  <rect x="66" y="150" width="120" height="6" rx="3" fill="#f6c343"/>
